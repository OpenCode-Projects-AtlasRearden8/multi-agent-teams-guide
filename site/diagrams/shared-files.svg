<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="d3t d3d" font-family="Trebuchet MS, Verdana, sans-serif">
  <title id="d3t">The shared folder floor plan</title>
  <desc id="d3d">A file tree: kickoff.md and log.md at the top, then folders notes, facts, drafts, final, archive. An arrow shows drafts flowing into final only after a checker memo approves them.</desc>
  <rect x="0" y="0" width="900" height="460" fill="#fbf7f0"/>
  <text x="230" y="40" font-size="20" font-weight="bold" fill="#5a4a3a" text-anchor="middle">The folder is the shared brain</text>
  <rect x="60" y="70" width="340" height="330" rx="12" fill="#fff" stroke="#8a7554" stroke-width="3"/>
  <text x="90" y="104" font-size="15" font-weight="bold" fill="#1f5f6a">kickoff.md</text>
  <text x="230" y="104" font-size="12" fill="#5a4a3a">goal, roster, definition of done</text>
  <text x="90" y="140" font-size="15" font-weight="bold" fill="#1f5f6a">log.md</text>
  <text x="230" y="140" font-size="12" fill="#5a4a3a">one line per event, newest first</text>
  <rect x="90" y="165" width="150" height="40" rx="8" fill="#e8e0d0" stroke="#8a7554" stroke-width="2"/>
  <text x="165" y="189" font-size="13" font-weight="bold" fill="#5a4a3a" text-anchor="middle">notes/</text>
  <text x="255" y="189" font-size="11" fill="#5a4a3a">memos, questions, decisions</text>
  <rect x="90" y="215" width="150" height="40" rx="8" fill="#f4e4cf" stroke="#b58a4a" stroke-width="2"/>
  <text x="165" y="239" font-size="13" font-weight="bold" fill="#7a5a26" text-anchor="middle">facts/</text>
  <text x="255" y="239" font-size="11" fill="#5a4a3a">ground truth, per item</text>
  <rect x="90" y="265" width="150" height="40" rx="8" fill="#f4e4cf" stroke="#b58a4a" stroke-width="2"/>
  <text x="165" y="289" font-size="13" font-weight="bold" fill="#7a5a26" text-anchor="middle">drafts/</text>
  <text x="255" y="289" font-size="11" fill="#5a4a3a">work in progress</text>
  <rect x="90" y="315" width="150" height="40" rx="8" fill="#cfe4e8" stroke="#2a7f8f" stroke-width="2"/>
  <text x="165" y="339" font-size="13" font-weight="bold" fill="#1f5f6a" text-anchor="middle">final/</text>
  <text x="255" y="339" font-size="11" fill="#5a4a3a">approved output only</text>
  <rect x="90" y="365" width="150" height="30" rx="8" fill="#eee" stroke="#aaa" stroke-width="2"/>
  <text x="165" y="385" font-size="12" fill="#666" text-anchor="middle">archive/</text>
  <text x="255" y="385" font-size="11" fill="#666">retired, kept anyway</text>
  <rect x="470" y="90" width="370" height="150" rx="12" fill="#fff" stroke="#8a7554" stroke-width="2"/>
  <text x="495" y="120" font-size="14" font-weight="bold" fill="#5a4a3a">One writer per file</text>
  <text x="495" y="146" font-size="12" fill="#5a4a3a">Researcher writes in facts/</text>
  <text x="495" y="170" font-size="12" fill="#5a4a3a">Writer writes in drafts/</text>
  <text x="495" y="194" font-size="12" fill="#5a4a3a">Checker writes memos in notes/</text>
  <text x="495" y="218" font-size="12" font-weight="bold" fill="#c96f6f">only YOU move files into final/</text>
  <rect x="470" y="270" width="370" height="130" rx="12" fill="#fff" stroke="#8a7554" stroke-width="2"/>
  <text x="495" y="300" font-size="14" font-weight="bold" fill="#5a4a3a">Status line, first line of every file</text>
  <text x="495" y="326" font-size="12" fill="#1f6ab0">STATUS: DRAFT — safe to edit</text>
  <text x="495" y="350" font-size="12" fill="#b58a4a">STATUS: REVIEW — checker, please look</text>
  <text x="495" y="374" font-size="12" fill="#4a7c3f">STATUS: APPROVED — boss said go</text>
  <text x="495" y="392" font-size="10" fill="#8a7554">(flip statuses only if you own the file)</text>
</svg>
