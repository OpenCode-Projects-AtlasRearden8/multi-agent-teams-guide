<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="d2t d2d" font-family="Trebuchet MS, Verdana, sans-serif">
  <title id="d2t">Roles and handoffs on a pipeline</title>
  <desc id="d2d">A pipeline of four roles: Planner, Researcher, Writer and Checker. Between each pair a handoff memo passes, carrying three sections: Done, Next, Watch out. Above them, the human boss reviews questions and approves work.</desc>
  <rect x="0" y="0" width="900" height="400" fill="#fbf7f0"/>
  <text x="450" y="40" font-size="20" font-weight="bold" fill="#5a4a3a" text-anchor="middle">The baton: every handoff carries Done / Next / Watch out</text>
  <rect x="60" y="150" width="160" height="92" rx="12" fill="#cfe4e8" stroke="#2a7f8f" stroke-width="3"/>
  <text x="140" y="188" font-size="16" font-weight="bold" fill="#1f5f6a" text-anchor="middle">Planner</text>
  <text x="140" y="212" font-size="12" fill="#1f5f6a" text-anchor="middle">splits the goal,</text>
  <text x="140" y="228" font-size="12" fill="#1f5f6a" text-anchor="middle">writes kickoff.md</text>
  <rect x="280" y="150" width="160" height="92" rx="12" fill="#f4e4cf" stroke="#b58a4a" stroke-width="3"/>
  <text x="360" y="188" font-size="16" font-weight="bold" fill="#7a5a26" text-anchor="middle">Researcher</text>
  <text x="360" y="212" font-size="12" fill="#7a5a26" text-anchor="middle">facts only,</text>
  <text x="360" y="228" font-size="12" fill="#7a5a26" text-anchor="middle">owns facts/</text>
  <rect x="500" y="150" width="160" height="92" rx="12" fill="#f4e4cf" stroke="#b58a4a" stroke-width="3"/>
  <text x="580" y="188" font-size="16" font-weight="bold" fill="#7a5a26" text-anchor="middle">Writer</text>
  <text x="580" y="212" font-size="12" fill="#7a5a26" text-anchor="middle">drafts only,</text>
  <text x="580" y="228" font-size="12" fill="#7a5a26" text-anchor="middle">owns drafts/</text>
  <rect x="720" y="150" width="150" height="92" rx="12" fill="#d8ddee" stroke="#5c6bb0" stroke-width="3"/>
  <text x="795" y="188" font-size="16" font-weight="bold" fill="#3a437a" text-anchor="middle">Checker</text>
  <text x="795" y="212" font-size="12" fill="#3a437a" text-anchor="middle">memos only,</text>
  <text x="795" y="228" font-size="12" fill="#3a437a" text-anchor="middle">never rewrites</text>
  <line x1="220" y1="196" x2="276" y2="196" stroke="#5a4a3a" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="440" y1="196" x2="496" y2="196" stroke="#5a4a3a" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="660" y1="196" x2="716" y2="196" stroke="#5a4a3a" stroke-width="3" marker-end="url(#arrow2)"/>
  <rect x="205" y="80" width="90" height="40" rx="8" fill="#fff" stroke="#2a7f8f" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="250" y="98" font-size="11" font-weight="bold" fill="#1f5f6a" text-anchor="middle">memo:</text>
  <text x="250" y="112" font-size="10" fill="#1f5f6a" text-anchor="middle">Done/Next/Watch</text>
  <rect x="410" y="260" width="90" height="40" rx="8" fill="#fff" stroke="#2a7f8f" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="455" y="278" font-size="11" font-weight="bold" fill="#1f5f6a" text-anchor="middle">memo:</text>
  <text x="455" y="292" font-size="10" fill="#1f5f6a" text-anchor="middle">fact sheet list</text>
  <rect x="625" y="80" width="90" height="40" rx="8" fill="#fff" stroke="#2a7f8f" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="670" y="98" font-size="11" font-weight="bold" fill="#1f5f6a" text-anchor="middle">memo:</text>
  <text x="670" y="112" font-size="10" fill="#1f5f6a" text-anchor="middle">draft + claim map</text>
  <rect x="330" y="330" width="240" height="46" rx="10" fill="#e8e0d0" stroke="#8a7554" stroke-width="2"/>
  <text x="450" y="350" font-size="14" font-weight="bold" fill="#5a4a3a" text-anchor="middle">YOU, the boss</text>
  <text x="450" y="368" font-size="11" fill="#5a4a3a" text-anchor="middle">reads questions, gives approvals, holds the veto</text>
  <line x1="370" y1="330" x2="250" y2="246" stroke="#8a7554" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <line x1="530" y1="330" x2="700" y2="246" stroke="#8a7554" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a4a3a"/>
    </marker>
  </defs>
</svg>
