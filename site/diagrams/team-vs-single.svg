<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="d1t d1d" font-family="Trebuchet MS, Verdana, sans-serif">
  <title id="d1t">Single agent versus a small team</title>
  <desc id="d1d">On the left, one agent box holds four jobs tangled in one long conversation. On the right, a Planner, two Workers and a Checker sit in separate short conversations, connected by a shared file passed between them.</desc>
  <rect x="0" y="0" width="900" height="480" fill="#fbf7f0"/>
  <text x="230" y="42" font-size="20" font-weight="bold" fill="#5a4a3a" text-anchor="middle">One agent, one long conversation</text>
  <rect x="120" y="80" width="220" height="120" rx="14" fill="#f2c9c9" stroke="#c96f6f" stroke-width="3"/>
  <text x="230" y="115" font-size="17" fill="#6b3a3a" text-anchor="middle">The One Agent</text>
  <text x="230" y="140" font-size="13" fill="#6b3a3a" text-anchor="middle">plans? researches? writes?</text>
  <text x="230" y="160" font-size="13" fill="#6b3a3a" text-anchor="middle">checks its own work...</text>
  <text x="230" y="190" font-size="12" fill="#8a5a5a" text-anchor="middle">message 40 of a very long chat</text>
  <rect x="120" y="240" width="220" height="170" rx="14" fill="#fff" stroke="#d9c3ab" stroke-width="2"/>
  <text x="230" y="272" font-size="14" font-weight="bold" fill="#5a4a3a" text-anchor="middle">Everything tangled here:</text>
  <path d="M150 290 C 200 260, 190 330, 260 300" fill="none" stroke="#c96f6f" stroke-width="2"/>
  <path d="M160 320 C 240 290, 170 350, 280 320" fill="none" stroke="#c96f6f" stroke-width="2"/>
  <path d="M155 345 C 230 360, 200 290, 270 350" fill="none" stroke="#c96f6f" stroke-width="2"/>
  <text x="230" y="395" font-size="12" fill="#8a5a5a" text-anchor="middle">facts blur, tone leaks, drift sneaks in</text>
  <text x="670" y="42" font-size="20" font-weight="bold" fill="#5a4a3a" text-anchor="middle">A tiny staff, four short conversations</text>
  <rect x="470" y="85" width="150" height="66" rx="12" fill="#cfe4e8" stroke="#2a7f8f" stroke-width="3"/>
  <text x="545" y="113" font-size="15" fill="#1f5f6a" text-anchor="middle">Planner</text>
  <text x="545" y="135" font-size="12" fill="#1f5f6a" text-anchor="middle">short chat #1</text>
  <rect x="660" y="85" width="150" height="66" rx="12" fill="#f4e4cf" stroke="#b58a4a" stroke-width="3"/>
  <text x="735" y="113" font-size="15" fill="#7a5a26" text-anchor="middle">Worker</text>
  <text x="735" y="135" font-size="12" fill="#7a5a26" text-anchor="middle">short chat #2</text>
  <rect x="470" y="230" width="150" height="66" rx="12" fill="#f4e4cf" stroke="#b58a4a" stroke-width="3"/>
  <text x="545" y="258" font-size="15" fill="#7a5a26" text-anchor="middle">Worker #2</text>
  <text x="545" y="280" font-size="12" fill="#7a5a26" text-anchor="middle">short chat #3</text>
  <rect x="660" y="230" width="150" height="66" rx="12" fill="#d8ddee" stroke="#5c6bb0" stroke-width="3"/>
  <text x="735" y="258" font-size="15" fill="#3a437a" text-anchor="middle">Checker</text>
  <text x="735" y="280" font-size="12" fill="#3a437a" text-anchor="middle">fresh eyes</text>
  <rect x="665" y="345" width="140" height="52" rx="10" fill="#fff" stroke="#2a7f8f" stroke-width="3" stroke-dasharray="5,4"/>
  <text x="735" y="368" font-size="13" font-weight="bold" fill="#1f5f6a" text-anchor="middle">shared file:</text>
  <text x="735" y="386" font-size="12" fill="#1f5f6a" text-anchor="middle">handoff memo</text>
  <line x1="620" y1="118" x2="656" y2="118" stroke="#5a4a3a" stroke-width="3" marker-end="url(#arrow1)"/>
  <line x1="735" y1="151" x2="735" y2="226" stroke="#5a4a3a" stroke-width="3" marker-end="url(#arrow1)"/>
  <line x1="660" y1="263" x2="624" y2="263" stroke="#5a4a3a" stroke-width="3" marker-end="url(#arrow1)"/>
  <line x1="735" y1="296" x2="735" y2="341" stroke="#5a4a3a" stroke-width="3" marker-end="url(#arrow1)"/>
  <line x1="545" y1="151" x2="545" y2="226" stroke="#5a4a3a" stroke-width="3" marker-end="url(#arrow1)"/>
  <text x="735" y="430" font-size="13" fill="#1f5f6a" font-weight="bold" text-anchor="middle">the file is the entire secret</text>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a4a3a"/>
    </marker>
  </defs>
</svg>
